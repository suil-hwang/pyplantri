[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pyplantri"
version = "0.7.0"
description = "FILTER-backed plantri enumeration for spherical simple quadrangulations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "src/LICENSE-2.0.txt"}
authors = [
    {name = "Suil Hwang", email = "av600md@gmail.com"}
]
keywords = ["graph", "planar", "quadrangulation", "plantri", "SQS", "enumeration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/suil-hwang/pyplantri"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
cmake.args = []
wheel.install-dir = "pyplantri/bin"
wheel.license-files = ["src/LICENSE-2.0.txt"]
wheel.packages = []
wheel.py-api = "py3"
editable.mode = "redirect"
editable.rebuild = true
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel.force-include]
"__init__.py" = "pyplantri/__init__.py"
"plantri.py" = "pyplantri/plantri.py"

